name: Deploy API (Cloudflare Workers)
# api/ が変わって main に push されたら、テストしてから Workers に反映する。手動実行も可
on:
  push:
    branches: [main]
    paths: ["api/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/api.mjs
      - name: Deploy
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Secrets の CLOUDFLARE_API_TOKEN が未登録です（README の「外部連携」を参照）"; exit 1; fi
          npx --yes wrangler@4 deploy
